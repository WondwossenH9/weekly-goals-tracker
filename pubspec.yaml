name: weekly_goals_tracker
description: Offline-first weekly goals & daily todo tracker (Android + Linux desktop).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local DB (offline-first source of truth)
  drift: ^2.30.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Backend / sync / auth
  supabase_flutter: ^2.5.6
  connectivity_plus: ^6.0.3

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # UI helpers
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.35.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
